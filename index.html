<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fisco Quest</title>
<meta name="description" content="Fisco Quest — rotina, trilhas de estudo, questões e conquistas para concurso de auditor fiscal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#07142A;--navy-800:#0B1E3C;
  --blue-400:#5AA0FF;--blue-500:#2F7BF6;--blue-600:#1B5FD9;--blue-700:#11418F;
  --cyan:#34D9F0;--cyan-soft:#8DE9F7;--gold:#F2C14E;
  --ink:#0E1E34;--ink-2:#3C4E6B;--ink-3:#5C6B84;   /* contraste 5,4:1 sobre branco */
  --gray-2:#E1E8F3;--gray-3:#C3CEDF;--gray-4:#7E8DA4;
  --green:#2FB673;--green-2:#1E8E58;--sheet:#F2F6FC;
  --card:0 1px 0 rgba(255,255,255,.9) inset,0 12px 22px -12px rgba(11,30,60,.30),0 2px 6px rgba(11,30,60,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow-x:hidden}
body{font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,sans-serif;
  background:radial-gradient(120% 80% at 50% 0%,#173063,#0A1830 55%,#060F1F);
  display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh}
.phone{position:relative;width:390px;height:844px;max-width:100vw;border-radius:44px;background:var(--sheet);
  overflow:hidden;box-shadow:0 50px 90px -30px rgba(0,0,0,.75),0 0 0 10px #0D1B33,0 0 0 11px #24406E}
@media (max-width:820px),(max-height:900px){.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none;max-width:100%}}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0 16px calc(128px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.view{display:none;animation:in .28s ease}
.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 6px 2px;font-size:13px;font-weight:600;color:var(--ink-2)}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 2px 2px;min-height:52px}
.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;
  background:linear-gradient(160deg,var(--blue-400),var(--blue-600) 60%,var(--blue-700));
  box-shadow:0 6px 12px -4px rgba(27,95,217,.6),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -3px 6px rgba(4,24,60,.4)}
.brand b{display:block;font-size:16.5px;font-weight:800;color:var(--ink);letter-spacing:-.3px;line-height:1.15}
.brand small{font-size:11.5px;font-weight:600;color:var(--ink-3)}
.pill-gold{margin-left:auto;display:flex;align-items:center;gap:6px;padding:8px 12px 8px 9px;border-radius:16px;flex:none;
  background:linear-gradient(180deg,#FFF3D6,#FCE3AB);color:#7A5306;font-weight:800;font-size:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 6px 12px -6px rgba(196,146,42,.7)}
.pill-blue{margin-left:auto;padding:8px 13px;border-radius:16px;flex:none;font-weight:800;font-size:13.5px;
  background:linear-gradient(180deg,#E2EEFF,#C9DDFB);color:#11418F;box-shadow:inset 0 1px 0 #fff,0 6px 12px -8px #1B5FD9}
.h-sec{font-size:15px;font-weight:700;color:var(--ink);margin:20px 2px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.h-sec em{font-style:normal;font-size:12.5px;font-weight:700;color:var(--blue-600);padding:8px 6px;margin:-8px -6px;cursor:pointer}
.card{background:linear-gradient(180deg,#FFF,#F7FAFF);border-radius:22px;box-shadow:var(--card);padding:16px}
.hero{position:relative;margin-top:12px;border-radius:28px;padding:18px;overflow:hidden;
  background:radial-gradient(120% 120% at 12% 0%,#1E3E78,#0E2247 45%,#0A1932);
  box-shadow:0 22px 36px -20px rgba(7,20,42,.9),inset 0 1px 0 rgba(140,190,255,.25)}
.hero:after{content:"";position:absolute;width:180px;height:180px;right:-60px;top:-70px;border-radius:50%;
  background:radial-gradient(circle,rgba(52,217,240,.3),transparent 65%)}
.hero-top{display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.ring{position:relative;width:74px;height:74px;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:20px;font-weight:800;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.ring b i{display:block;font-size:8.5px;font-style:normal;font-weight:700;letter-spacing:1.4px;color:var(--cyan-soft);margin-bottom:-3px}
.hero h2{margin:0;color:#fff;font-size:17px;font-weight:800;letter-spacing:-.3px}
.hero .sub{margin:2px 0 0;color:#9FB6DA;font-size:12px;font-weight:600}
.xpline{display:flex;align-items:baseline;gap:5px;margin-top:8px}
.xpline u{text-decoration:none;color:var(--gold);font-size:21px;font-weight:800;letter-spacing:-.5px}
.xpline s{text-decoration:none;color:#8FA6CB;font-size:12px;font-weight:600}
.track{height:12px;border-radius:9px;background:rgba(6,16,34,.66);box-shadow:inset 0 2px 4px rgba(0,0,0,.55);overflow:hidden;margin-top:12px;position:relative;z-index:2}
.fill{height:100%;border-radius:9px;width:0;transition:width .7s cubic-bezier(.2,.8,.25,1);
  background:linear-gradient(180deg,#6FB5FF,var(--blue-500) 55%,#1550C0);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 14px rgba(47,123,246,.85)}
.fill.cy{background:linear-gradient(180deg,#8DE9F7,#34D9F0 55%,#1596B4);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 14px rgba(52,217,240,.8)}
.legend{display:flex;justify-content:space-between;margin-top:7px;position:relative;z-index:2;font-size:11.5px;font-weight:600;color:#8FA6CB}
.float{animation:float 4.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.cheer{animation:cheer .7s cubic-bezier(.3,1.4,.4,1) 2}
@keyframes cheer{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-16px) rotate(-7deg)}60%{transform:translateY(-4px) rotate(5deg)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:12px}
.stat{border-radius:20px;padding:13px 14px;background:linear-gradient(180deg,#FFF,#F4F8FF);box-shadow:var(--card);min-width:0}
.stat em{display:block;font-style:normal;font-size:11.5px;font-weight:700;color:var(--ink-3);margin-bottom:5px}
.stat b{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.6px;display:block}
.stat b small{font-size:12px;font-weight:700;color:var(--ink-3)}
.mini{height:9px;border-radius:6px;background:var(--gray-2);margin-top:9px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(11,30,60,.18)}
.mini i{display:block;height:100%;border-radius:6px;width:0;transition:width .55s cubic-bezier(.2,.8,.25,1);
  background:linear-gradient(180deg,#6FB5FF,#2F7BF6);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.mini i.gold{background:linear-gradient(180deg,#FFD87A,#D79B23)}
.mini i.cy{background:linear-gradient(180deg,#8DE9F7,#20B6D4)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qbtn{border:0;padding:12px 2px 10px;border-radius:20px;cursor:pointer;font-family:inherit;min-height:64px;
  background:linear-gradient(180deg,#FFF,#EDF3FD);color:var(--ink-2);font-size:10px;font-weight:700;
  box-shadow:0 1px 0 #fff inset,0 8px 14px -9px rgba(11,30,60,.5);display:grid;justify-items:center;gap:6px;transition:transform .12s,box-shadow .12s}
.qbtn:active{transform:translateY(3px) scale(.97);box-shadow:0 3px 6px -5px rgba(11,30,60,.5)}
.qbtn:focus-visible,.tab:focus-visible,.btn3d:focus-visible,.row:focus-visible,.blk:focus-visible,.medcard:focus-visible{outline:3px solid var(--blue-500);outline-offset:2px}
.ico{width:46px;height:46px;border-radius:15px;flex:none;display:grid;place-items:center;color:#fff;
  background:linear-gradient(165deg,#7FC0FF,#1B5FD9);box-shadow:0 7px 12px -7px rgba(27,95,217,.9),inset 0 1px 0 rgba(255,255,255,.55)}
.ico.sm{width:38px;height:38px;border-radius:13px}
.ico.dim{background:linear-gradient(165deg,#C6D2E2,#93A2B8);box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}
.ico.gold{background:linear-gradient(165deg,#FFE49B,#D79B23);box-shadow:0 7px 12px -7px rgba(196,146,42,.9),inset 0 1px 0 rgba(255,255,255,.6)}
.row{width:100%;text-align:left;border:0;font-family:inherit;display:flex;align-items:center;gap:13px;padding:14px;border-radius:20px;margin-bottom:11px;cursor:pointer;
  background:linear-gradient(180deg,#FFF,#F6FAFF);box-shadow:var(--card);transition:transform .12s,box-shadow .12s}
.row:active{transform:translateY(2px) scale(.99);box-shadow:0 4px 10px -8px rgba(11,30,60,.5)}
.row h4{margin:0;font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-.2px;line-height:1.25}
.row p{margin:4px 0 0;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.pct{font-size:14px;font-weight:800;color:var(--ink);flex:none;margin-left:auto}
.pct.done{color:var(--green-2)}
.tile{position:relative;display:flex;align-items:center;gap:13px;padding:14px;border-radius:22px;margin-bottom:11px;
  background:linear-gradient(180deg,#FFF,#F6FAFF);box-shadow:var(--card);transition:transform .25s,box-shadow .25s,opacity .25s}
.tile h4{margin:0;font-size:14.5px;font-weight:700;color:var(--ink);letter-spacing:-.2px}
.tile p{margin:4px 0 0;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.tile.done{background:linear-gradient(180deg,#EEF2F8,#E7EDF6);box-shadow:inset 0 2px 5px rgba(11,30,60,.10);transform:scale(.985)}
.tile.done h4{color:#6C7C96}
.tile.wait{background:linear-gradient(180deg,#F2F5FA,#EDF1F7);box-shadow:none;opacity:.8}
.tile.wait h4{color:var(--gray-4)}
.tile.current{display:block;padding:18px 16px;background:radial-gradient(130% 140% at 18% 0%,#22488C,#102850 50%,#0A1B38);
  box-shadow:0 20px 34px -18px rgba(23,74,160,.95),0 0 0 1px rgba(90,160,255,.35),inset 0 1px 0 rgba(150,200,255,.35);animation:glow 3.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 20px 34px -18px rgba(23,74,160,.9),0 0 0 1px rgba(90,160,255,.3),inset 0 1px 0 rgba(150,200,255,.3)}
50%{box-shadow:0 24px 40px -16px rgba(38,110,230,1),0 0 0 1px rgba(120,185,255,.55),inset 0 1px 0 rgba(150,200,255,.4)}}
.tile.current h4{color:#fff;font-size:16px}
.tile.current p{color:#9EB8DD}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:10px;font-size:10.5px;font-weight:800;letter-spacing:.2px}
.badge.now{background:linear-gradient(180deg,#6FB5FF,#2F7BF6);color:#05214E;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.badge.ok{background:#DFF5E9;color:var(--green-2);margin-top:6px}
.badge.live{background:linear-gradient(180deg,#8DE9F7,#20B6D4);color:#03293A;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.btn3d{width:100%;border:0;cursor:pointer;font-family:inherit;font-size:14.5px;font-weight:800;letter-spacing:.4px;
  min-height:52px;padding:15px 16px;border-radius:19px;color:#fff;display:flex;align-items:center;justify-content:center;gap:9px;
  background:linear-gradient(180deg,#63AAFF,#2F7BF6 45%,#1B5FD9);
  box-shadow:0 6px 0 #0F3C8C,0 16px 24px -10px rgba(27,95,217,.75),inset 0 1px 0 rgba(255,255,255,.55);transition:transform .1s,box-shadow .1s}
.btn3d:active{transform:translateY(5px);box-shadow:0 1px 0 #0F3C8C,0 6px 12px -8px rgba(27,95,217,.8),inset 0 1px 0 rgba(255,255,255,.4)}
.btn3d.is-undo{background:linear-gradient(180deg,#EDF1F7,#D9E1EC);color:#5A6A82;box-shadow:0 4px 0 #BFCBDC,inset 0 1px 0 rgba(255,255,255,.9)}
.btn-sm{border:0;cursor:pointer;font-family:inherit;font-size:12px;font-weight:800;letter-spacing:.3px;min-height:44px;
  padding:11px 13px;border-radius:15px;color:#fff;display:inline-flex;align-items:center;gap:7px;flex:none;
  background:linear-gradient(180deg,#63AAFF,#2F7BF6 50%,#1B5FD9);box-shadow:0 4px 0 #0F3C8C,inset 0 1px 0 rgba(255,255,255,.5);transition:transform .1s,box-shadow .1s}
.btn-sm:active{transform:translateY(3px);box-shadow:0 1px 0 #0F3C8C,inset 0 1px 0 rgba(255,255,255,.4)}
.btn-sm.gray{background:linear-gradient(180deg,#EDF1F7,#D9E1EC);color:#5A6A82;box-shadow:0 4px 0 #BFCBDC,inset 0 1px 0 rgba(255,255,255,.9)}
.back{border:0;background:linear-gradient(180deg,#FFF,#E9EFF9);width:42px;height:42px;border-radius:14px;display:grid;place-items:center;cursor:pointer;flex:none;
  box-shadow:0 4px 0 #CFDAE9,inset 0 1px 0 #fff;transition:transform .1s,box-shadow .1s}
.back:active{transform:translateY(3px);box-shadow:0 1px 0 #CFDAE9,inset 0 1px 0 #fff}
.blk{width:100%;text-align:left;border:0;font-family:inherit;display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:18px;margin-bottom:9px;cursor:pointer;min-height:56px;
  background:linear-gradient(180deg,#FFF,#F7FAFF);box-shadow:var(--card);transition:transform .12s,box-shadow .12s,background .2s}
.blk:active{transform:scale(.985) translateY(2px)}
.blk .num{font-size:11px;font-weight:800;color:var(--ink-3);flex:none;width:18px}
.blk .txt{font-size:13px;font-weight:600;color:var(--ink);line-height:1.35;flex:1;min-width:0}
.blk .box{width:28px;height:28px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:linear-gradient(180deg,#F1F5FB,#E1E8F3);box-shadow:inset 0 2px 4px rgba(11,30,60,.16)}
.blk.ok{background:linear-gradient(180deg,#F1FAF5,#E6F5ED);box-shadow:inset 0 2px 5px rgba(30,142,88,.12)}
.blk.ok .txt{color:#5E7286;text-decoration:line-through;text-decoration-color:rgba(47,182,115,.6)}
.blk.ok .box{background:linear-gradient(180deg,#57D69A,#1E8E58);box-shadow:0 5px 10px -5px rgba(30,142,88,.8),inset 0 1px 0 rgba(255,255,255,.5)}

/* ---------- medalhas ---------- */
.medsec{margin-bottom:20px}
.medhead{display:flex;align-items:center;gap:11px;margin:0 2px 11px}
.medhead h4{margin:0;font-size:13.5px;font-weight:800;color:var(--ink);line-height:1.2}
.medhead .cnt{margin-left:auto;font-size:12px;font-weight:800;color:var(--blue-600);flex:none}
.medgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.medcard{border:0;font-family:inherit;cursor:pointer;border-radius:20px;padding:12px 8px 11px;text-align:center;min-width:0;
  background:linear-gradient(180deg,#FFF,#F5F9FF);box-shadow:var(--card);transition:transform .14s,box-shadow .14s}
.medcard:active{transform:translateY(2px) scale(.97)}
.medcard.lock{background:linear-gradient(180deg,#F3F6FB,#EBF0F7);box-shadow:none}
.medcard h5{margin:6px 0 2px;font-size:11.5px;font-weight:800;color:var(--ink);line-height:1.25;overflow-wrap:anywhere}
.medcard.lock h5{color:var(--gray-4)}
.medcard span.rar{font-size:9px;font-weight:800;letter-spacing:.6px;color:var(--ink-3)}
.msvg.off{filter:saturate(.12) brightness(.99)}
.msvg.r5,.msvg.r6{animation:msh 5s ease-in-out infinite}
@keyframes msh{0%,100%{filter:drop-shadow(0 4px 8px rgba(11,30,60,.22))}50%{filter:drop-shadow(0 4px 14px rgba(120,200,255,.75))}}
.msvg.r6{animation-duration:4s}
.novo{animation:novo .8s cubic-bezier(.3,1.5,.4,1)}
@keyframes novo{0%{transform:scale(.2) rotate(-25deg);filter:saturate(.1)}55%{transform:scale(1.14) rotate(4deg);filter:saturate(1.2)}100%{transform:scale(1) rotate(0);filter:none}}

/* ---------- cronograma ---------- */
.crodate{font-size:10.5px;font-weight:800;letter-spacing:1.5px;color:var(--cyan-soft);position:relative;z-index:2}
.cro-now{position:relative;margin-top:12px;border-radius:26px;padding:17px 16px;overflow:hidden;
  background:radial-gradient(130% 140% at 18% 0%,#18608E,#0F3A66 48%,#0A1B38);
  box-shadow:0 20px 34px -18px rgba(20,130,200,.95),0 0 0 1px rgba(90,205,255,.45),inset 0 1px 0 rgba(150,225,255,.35);
  animation:glowcy 3.2s ease-in-out infinite}
@keyframes glowcy{0%,100%{box-shadow:0 20px 34px -18px rgba(20,130,200,.85),0 0 0 1px rgba(90,205,255,.35),inset 0 1px 0 rgba(150,225,255,.3)}
50%{box-shadow:0 24px 40px -16px rgba(40,180,235,1),0 0 0 1px rgba(140,230,255,.65),inset 0 1px 0 rgba(150,225,255,.42)}}
.cro-now:after{content:"";position:absolute;width:150px;height:150px;right:-50px;top:-60px;border-radius:50%;
  background:radial-gradient(circle,rgba(141,233,247,.35),transparent 65%)}
.cro-now h3{margin:8px 0 2px;color:#fff;font-size:19px;font-weight:800;letter-spacing:-.4px;position:relative;z-index:2}
.cro-now p{margin:0;color:#A7CBEA;font-size:12px;font-weight:600;position:relative;z-index:2}
.cro-now .hh{color:#8DE9F7;font-size:13.5px;font-weight:800;letter-spacing:.3px}
.cro-idle{margin-top:12px;border-radius:26px;padding:16px;background:linear-gradient(180deg,#FFF,#F4F8FF);box-shadow:var(--card);display:flex;align-items:center;gap:13px}
.cro-idle h3{margin:0;font-size:14.5px;font-weight:800;color:var(--ink)}
.cro-idle p{margin:4px 0 0;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.per{display:flex;align-items:center;gap:8px;margin:22px 2px 11px;font-size:12px;font-weight:800;letter-spacing:1.3px;color:var(--ink-2)}
.per i{flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--gray-2),transparent)}
.slot{width:100%;text-align:left;border:0;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:18px;margin-bottom:8px;
  background:linear-gradient(180deg,#FFF,#F7FAFF);box-shadow:var(--card);transition:opacity .25s,transform .15s,box-shadow .15s}
.slot:active{transform:scale(.985) translateY(2px)}
.slot:focus-visible{outline:3px solid var(--blue-500);outline-offset:2px}
/* recompensa de XP voando */
.xpfly{position:absolute;z-index:70;pointer-events:none;animation:xpup 1.1s ease-out forwards}
.xpfly.neg b{background:linear-gradient(180deg,#EDF1F7,#CFD9E6);color:#41516B;box-shadow:0 8px 16px -8px rgba(11,30,60,.5)}
.xpfly b{display:inline-block;padding:6px 11px;border-radius:13px;font-size:13px;font-weight:800;color:#03293A;
  background:linear-gradient(180deg,#BFF3FB,#34D9F0);box-shadow:0 8px 16px -8px rgba(20,160,200,.9),inset 0 1px 0 rgba(255,255,255,.8)}
@keyframes xpup{0%{opacity:0;transform:translateY(10px) scale(.8)}18%{opacity:1;transform:translateY(0) scale(1.07)}
35%{transform:translateY(-4px) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(.92)}}
.xpp{position:absolute;left:20px;top:12px;width:6px;height:6px;border-radius:50%;background:#8DE9F7;opacity:0;animation:part .9s ease-out forwards}
.slot.late .shr{color:#B07A1E}
.slot.late .sbox{box-shadow:inset 0 0 0 2px rgba(216,155,35,.6),inset 0 2px 4px rgba(11,30,60,.14)}
.sbox{flex:none;width:26px;height:26px;border-radius:9px;
  background:linear-gradient(180deg,#F1F5FB,#E1E8F3);box-shadow:inset 0 2px 4px rgba(11,30,60,.16)}
.slot.live .sbox{background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.12));box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
.slot .shr{width:48px;flex:none;font-size:11.5px;font-weight:800;color:var(--ink-2);line-height:1.35}
.slot .shr span{display:block;font-size:10px;font-weight:700;color:var(--ink-3)}
.slot .sbody{flex:1;min-width:0}
.slot h4{margin:0;font-size:13.5px;font-weight:700;color:var(--ink);letter-spacing:-.2px;line-height:1.25}
.slot p{margin:3px 0 0;font-size:11px;font-weight:600;color:var(--ink-3)}
.sico{width:34px;height:34px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff;
  background:linear-gradient(165deg,#A9C2DC,#7C90A8);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.sico.estudo{background:linear-gradient(165deg,#7FC0FF,#1B5FD9);box-shadow:0 6px 11px -7px rgba(27,95,217,.9),inset 0 1px 0 rgba(255,255,255,.55)}
.sico.treino{background:linear-gradient(165deg,#6FE6B4,#1E8E58)}
.sico.cochilo{background:linear-gradient(165deg,#B7A6F5,#5B45B8)}
.slot.past{background:linear-gradient(180deg,#EEF2F8,#E6ECF6);box-shadow:inset 0 2px 5px rgba(11,30,60,.08)}
.slot.past h4{color:#6C7C96}
.slot.past .sico{background:linear-gradient(165deg,#CBD6E5,#9BA9BE);box-shadow:none}
.slot.fut{opacity:.9}
.slot.live{background:radial-gradient(130% 150% at 18% 0%,#17608F,#0E3663 55%,#0A1B38);
  box-shadow:0 16px 28px -16px rgba(20,140,205,.95),0 0 0 1px rgba(110,220,255,.5),inset 0 1px 0 rgba(150,225,255,.3);
  animation:glowcy 3.2s ease-in-out infinite}
.slot.live h4{color:#fff;font-size:14.5px}
.slot.live p{color:#9ED4EE}
.slot.live .shr{color:#8DE9F7}
.slot.live .shr span{color:#7FA8C8}
.sok{flex:none;width:24px;height:24px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(180deg,#57D69A,#1E8E58);box-shadow:0 5px 9px -5px rgba(30,142,88,.8),inset 0 1px 0 rgba(255,255,255,.5)}
.snow{flex:none;font-size:9.5px;font-weight:800;letter-spacing:.8px;color:#03293A;padding:4px 8px;border-radius:9px;
  background:linear-gradient(180deg,#8DE9F7,#20B6D4);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.meta-band{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 4px;padding:12px;border-radius:18px;
  font-size:12px;font-weight:800;letter-spacing:1px;color:#7A5306;
  background:linear-gradient(180deg,#FFF3D6,#FCE3AB);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 14px -10px rgba(196,146,42,.8)}
.dots{display:flex;gap:6px;margin-top:12px}
.dots i{flex:1;height:8px;border-radius:5px;background:var(--gray-2);box-shadow:inset 0 1px 2px rgba(11,30,60,.16);transition:background .4s}
.dots i.on{background:linear-gradient(180deg,#8DE9F7,#20B6D4);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 8px rgba(52,217,240,.7)}
.dots i.half{background:linear-gradient(90deg,#34D9F0 50%,var(--gray-2) 50%)}

/* ---------- questões ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;font-family:inherit;white-space:nowrap;cursor:pointer;padding:9px 13px;border-radius:14px;font-size:11.5px;font-weight:800;
  background:linear-gradient(180deg,#FFF,#E9EFF9);color:var(--ink-2);box-shadow:var(--card);flex:none}
.chip.on{background:linear-gradient(180deg,#63AAFF,#1B5FD9);color:#fff;box-shadow:0 8px 14px -8px rgba(27,95,217,.9),inset 0 1px 0 rgba(255,255,255,.5)}
.qblk{padding:13px 14px;border-radius:18px;margin-bottom:9px;background:linear-gradient(180deg,#FFF,#F7FAFF);box-shadow:var(--card)}
.qblk.edit{background:linear-gradient(180deg,#F4F9FF,#E9F1FD);box-shadow:0 0 0 1px rgba(47,123,246,.35),var(--card)}
.qblk h4{margin:0;font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.25}
.qblk p{margin:5px 0 0;font-size:11px;font-weight:600;color:var(--ink-3)}
.qtop{display:flex;align-items:flex-start;gap:9px}
.qtop .num{font-size:11px;font-weight:800;color:var(--ink-3);width:16px;flex:none;padding-top:2px}
.qpct{margin-left:auto;flex:none;font-size:15px;font-weight:800;color:var(--ink)}
.stpill{display:inline-block;margin-top:6px;font-size:9.5px;font-weight:800;letter-spacing:.5px;padding:4px 9px;border-radius:9px}
.st-exc{background:#DFF5E9;color:#1E8E58}.st-mb{background:#E2EEFF;color:#11418F}.st-bom{background:#E6F6FA;color:#12587C}
.st-at{background:#FFF3D6;color:#7A5306}.st-rev{background:#FBE4E2;color:#9B2C24}.st-zero{background:#EEF2F8;color:#7A89A3}
.barx{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--gray-2);margin-top:9px;box-shadow:inset 0 1px 2px rgba(11,30,60,.16)}
.barx i{display:block;height:100%}
.qnum{display:flex;align-items:center;gap:8px;margin-top:10px}
.qnum label{flex:none}
.qnum b{display:block;width:64px;font-size:11px;font-weight:800;letter-spacing:.4px;color:var(--ink-3)}
.qstep{width:40px;height:40px;flex:none;border:0;border-radius:13px;cursor:pointer;font-family:inherit;font-size:19px;font-weight:800;
  background:linear-gradient(180deg,#FFF,#E3EBF7);color:#1B5FD9;box-shadow:0 3px 0 #C6D3E5,inset 0 1px 0 #fff}
.qstep:active{transform:translateY(2px);box-shadow:0 1px 0 #C6D3E5}
.qinput{flex:1;min-width:0;height:40px;border:0;border-radius:13px;text-align:center;font-family:inherit;font-size:16px;font-weight:800;
  color:var(--ink);background:#EDF2FA;box-shadow:inset 0 2px 4px rgba(11,30,60,.14)}
.qacoes{display:flex;gap:9px;margin-top:11px}
.ta{width:100%;height:112px;margin-top:12px;padding:10px;border:0;border-radius:13px;font-family:inherit;font-size:11px;
  line-height:1.4;color:var(--ink);background:#EDF2FA;box-shadow:inset 0 2px 4px rgba(11,30,60,.14);resize:none}
.aviso{margin-top:12px;padding:12px 14px;border-radius:18px;font-size:11.5px;font-weight:700;line-height:1.4;
  color:#7A5306;background:linear-gradient(180deg,#FFF3D6,#FCE3AB);box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.qprev{margin-top:9px;text-align:center;font-size:12px;font-weight:800;color:var(--blue-600)}
.chart{display:flex;align-items:flex-end;gap:6px;height:104px;margin-top:6px}
.cbar{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.cbar i{display:block;border-radius:7px 7px 3px 3px;min-height:4px;background:linear-gradient(180deg,#6FB5FF,#2F7BF6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.cbar i.hoje{background:linear-gradient(180deg,#8DE9F7,#20B6D4)}
.cbar span{font-size:9px;font-weight:700;color:var(--ink-3);text-align:center;margin-top:6px}
.qlist{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:16px;margin-bottom:8px;
  background:linear-gradient(180deg,#FFF,#F7FAFF);box-shadow:var(--card)}
.qlist .pos{width:20px;flex:none;font-size:12px;font-weight:800;color:var(--ink-3)}
.qlist h4{margin:0;font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.25}
.qlist p{margin:3px 0 0;font-size:10.5px;font-weight:600;color:var(--ink-3)}

/* overlay de desbloqueio */
.unlock.saindo{animation:fadeout .24s ease forwards}
@keyframes fadeout{to{opacity:0;transform:scale(.97)}}
.unlock{position:absolute;inset:0;z-index:80;display:grid;place-items:center;background:rgba(6,16,34,.72);backdrop-filter:blur(5px);animation:in .18s ease;padding:20px}
.ubox{position:relative;width:100%;max-width:290px;border-radius:30px;padding:26px 18px 22px;text-align:center;
  background:radial-gradient(130% 130% at 20% 0%,#23508F,#0A1B38);box-shadow:0 30px 60px -20px rgba(0,0,0,.85),inset 0 1px 0 rgba(150,200,255,.3)}
.halo{position:absolute;left:50%;top:74px;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;
  background:radial-gradient(circle,rgba(120,200,255,.55),rgba(120,200,255,0) 62%);animation:halo 1.6s ease-out}
@keyframes halo{0%{transform:scale(.3);opacity:0}35%{transform:scale(1.05);opacity:1}100%{transform:scale(1.25);opacity:.55}}
.umed{position:relative;z-index:2;animation:umed .75s cubic-bezier(.25,1.5,.4,1)}
@keyframes umed{0%{transform:scale(.05) rotate(-40deg);opacity:0}45%{transform:scale(1.12) rotate(6deg);opacity:1}70%{transform:scale(.97) rotate(-2deg)}100%{transform:scale(1) rotate(0)}}
.uhead{position:relative;z-index:2;margin-top:10px;font-size:11px;font-weight:800;letter-spacing:1.6px;color:var(--cyan-soft)}
.uname{position:relative;z-index:2;margin:6px 0 3px;font-size:20px;font-weight:800;color:#fff;line-height:1.2;letter-spacing:-.3px}
.umat{position:relative;z-index:2;font-size:11.5px;font-weight:700;color:#9EB8DD}
.part{position:absolute;left:50%;top:74px;width:7px;height:7px;border-radius:50%;background:var(--cyan-soft);opacity:0;animation:part 1.3s ease-out forwards}
@keyframes part{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.utoast{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:2;font-size:12px;font-weight:800;color:#fff;
  background:rgba(255,255,255,.14);padding:8px 14px;border-radius:14px}

/* evolução de nível */
.levelup{position:absolute;inset:0;z-index:95;display:grid;place-items:center;background:rgba(5,13,28,.82);backdrop-filter:blur(6px);animation:in .2s ease;padding:20px}
.lbox{position:relative;width:100%;max-width:300px;border-radius:32px;padding:26px 18px 24px;text-align:center;
  background:radial-gradient(130% 130% at 20% 0%,#1F4B92,#08152C);box-shadow:0 34px 64px -20px rgba(0,0,0,.9),inset 0 1px 0 rgba(160,210,255,.35)}
.lhalo{position:absolute;left:50%;top:104px;width:250px;height:250px;margin:-125px 0 0 -125px;border-radius:50%;
  background:radial-gradient(circle,rgba(242,193,78,.55),rgba(120,200,255,.22) 45%,transparent 68%);animation:lhalo 2.6s ease-out}
@keyframes lhalo{0%{transform:scale(.2) rotate(0);opacity:0}30%{transform:scale(1) rotate(30deg);opacity:1}100%{transform:scale(1.3) rotate(80deg);opacity:.5}}
.lmasc{position:relative;z-index:2;animation:evolui 2.4s cubic-bezier(.25,.9,.3,1)}
@keyframes evolui{0%{transform:scale(.75);filter:brightness(1)}
18%{transform:scale(.82);filter:brightness(2.6) saturate(.4)}
34%{transform:scale(1.22);filter:brightness(3.4) saturate(0)}
46%{transform:scale(1.05) rotate(-4deg);filter:brightness(1.5)}
60%{transform:scale(1.12) rotate(4deg);filter:brightness(1.05)}
74%{transform:scale(.98) rotate(-2deg)}100%{transform:scale(1) rotate(0);filter:none}}
.lring{position:absolute;left:50%;top:104px;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;
  border:2px solid rgba(242,193,78,.75);animation:lring 1.9s ease-out .35s both}
@keyframes lring{0%{transform:scale(.25);opacity:0}40%{opacity:1}100%{transform:scale(1.45);opacity:0}}
.lxp{position:relative;z-index:2;display:inline-block;margin-top:12px;padding:7px 14px;border-radius:14px;font-size:11.5px;font-weight:800;letter-spacing:.6px;
  background:linear-gradient(180deg,#FFF3D6,#FCE3AB);color:#7A5306;box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}

/* modal detalhe */
.modal{position:absolute;inset:0;z-index:85;display:grid;place-items:center;background:rgba(6,16,34,.68);backdrop-filter:blur(5px);animation:in .18s ease;padding:20px}
.mbox{width:100%;max-width:300px;border-radius:28px;padding:22px 18px 18px;text-align:center;
  background:radial-gradient(130% 130% at 20% 0%,#22488C,#0A1B38);box-shadow:0 30px 60px -22px rgba(0,0,0,.85),inset 0 1px 0 rgba(150,200,255,.3)}
.mbox h3{margin:10px 0 3px;font-size:19px;font-weight:800;color:#fff;line-height:1.2}
.mbox .mmat{font-size:11.5px;font-weight:700;color:#9EB8DD}
.mrar{display:inline-block;margin:10px 0 12px;padding:5px 12px;border-radius:12px;font-size:10px;font-weight:800;letter-spacing:1px}
.mbox .lbl{font-size:9.5px;font-weight:800;letter-spacing:1.2px;color:#7C9AC6;margin-top:12px}
.mbox .val{font-size:12.5px;font-weight:600;color:#DCE8F8;line-height:1.45;margin-top:4px;overflow-wrap:anywhere}
.mstatus{margin-top:14px;padding:11px;border-radius:16px;font-size:12.5px;font-weight:800;letter-spacing:.4px}
.mstatus.on{background:linear-gradient(180deg,#3FCB8A,#1E8E58);color:#04331E;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.mstatus.off{background:rgba(255,255,255,.1);color:#A9BEDC}
.mclose{margin-top:12px;width:100%;border:0;font-family:inherit;cursor:pointer;min-height:46px;border-radius:16px;font-size:13px;font-weight:800;
  color:#0A2A5E;background:linear-gradient(180deg,#BEDCFF,#63AAFF);box-shadow:0 4px 0 #2F6FC4,inset 0 1px 0 rgba(255,255,255,.6)}
.mclose:active{transform:translateY(3px);box-shadow:0 1px 0 #2F6FC4}

.toast{position:absolute;left:50%;top:46%;transform:translateX(-50%);z-index:60;pointer-events:none;white-space:nowrap;max-width:92%;
  padding:10px 18px;border-radius:18px;font-size:16px;font-weight:800;color:#3B2A00;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(180deg,#FFE9AE,#F2C14E);box-shadow:0 14px 26px -10px rgba(180,130,20,.8),inset 0 1px 0 rgba(255,255,255,.9);
  opacity:0;animation:pop 1.5s ease forwards}
.toast.blue{background:linear-gradient(180deg,#BEDCFF,#63AAFF);color:#08285E}
.toast.gray{background:linear-gradient(180deg,#EDF1F7,#CFD9E6);color:#41516B}
@keyframes pop{0%{opacity:0;transform:translate(-50%,14px) scale(.85)}20%{opacity:1;transform:translate(-50%,0) scale(1.05)}
35%{transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-52px) scale(.95)}}
.celebrate{position:absolute;inset:0;z-index:75;display:grid;place-items:center;background:rgba(7,20,42,.6);backdrop-filter:blur(4px);animation:in .2s ease;padding:20px}
.celebrate .box{width:100%;max-width:280px;border-radius:28px;padding:22px 20px;text-align:center;
  background:radial-gradient(120% 130% at 18% 0%,#22488C,#0A1B38);box-shadow:0 30px 50px -20px rgba(0,0,0,.8),inset 0 1px 0 rgba(150,200,255,.3)}
.celebrate h3{margin:8px 0 4px;color:#fff;font-size:19px;font-weight:800}
.celebrate p{margin:0 0 16px;color:#9EB8DD;font-size:12.5px;font-weight:600;line-height:1.45}
.tabbar{position:absolute;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));height:70px;border-radius:26px;
  display:grid;grid-template-columns:repeat(6,1fr);align-items:center;padding:0 2px;z-index:40;
  background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(238,244,252,.97));backdrop-filter:blur(14px);
  box-shadow:0 18px 34px -16px rgba(11,30,60,.45),inset 0 1px 0 #fff}
.tab{border:0;background:none;cursor:pointer;font-family:inherit;display:grid;justify-items:center;gap:3px;padding:8px 1px;min-height:60px;min-width:0;
  color:var(--gray-4);font-size:8.4px;font-weight:700;letter-spacing:-.1px;transition:color .2s,transform .12s}
.tab span.lbl{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.1}
.tab:active{transform:scale(.93)}
.tab.on{color:var(--blue-600)}
.tab .pillicon{width:36px;height:28px;border-radius:11px;display:grid;place-items:center;transition:all .25s}
.tab.on .pillicon{background:linear-gradient(180deg,#63AAFF,#1B5FD9);color:#fff;transform:translateY(-2px);
  box-shadow:0 8px 14px -6px rgba(27,95,217,.8),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -3px 6px rgba(6,30,80,.4)}
/* ícones e decorações nunca capturam o toque: o alvo é sempre o botão */
.row svg,.row .ico,.row .mini,.qbtn svg,.tab svg,.tab .pillicon,.blk svg,.blk .box,.blk .num,.blk .txt,
.medcard svg,.medcard h5,.medcard .rar,.btn3d svg,.btn-sm svg,.back svg,.tile svg,.h-sec em svg,.slot svg{pointer-events:none}
.h-sec em{cursor:pointer}
@media (max-width:359px){.qbtn{font-size:9px}.medcard h5{font-size:10.5px}.tab{font-size:7.8px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
.part{display:none}.halo{opacity:.5}}
</style>
</head>

/* ===================== DADOS ===================== */

  'NoSQL e ferramentas de análise de dados','Data mining e big data','Inteligência artificial','Machine learning',
  'Python e linguagem R','Segurança da informação e LGPD']}

const TOTAL_BLOCOS=MATERIAS.reduce((s,m)=>s+m.blocos.length,0);
/* ===== XP — uma fonte por tipo de ação, sem sobreposição =====
   ESTUDO REAL .... 25 por bloco · 120 por matéria do ciclo · 500 de bônus por ciclo
   HÁBITO (cronograma) ... 5 por atividade · 10 por período de estudo · 40 pelo dia completo
   MEDALHAS DE ROTINA .... 40 a 300, pagos uma única vez por medalha
   AUDITORIA DOS 400 XP: vinham de XP_DIA = 200, concedido por checarDia(), que rodava
   no relógio (tique + ao abrir o app). Como a conclusão era deduzida do horário, o app
   pagava 200 XP por dia só por o relógio passar das 19:05 — 2 dias = os 400 XP.
   Recompensa por tempo, sem ação do usuário: era erro de lógica. Substituída pelo
   bônus XP_ROT_DIA, pago só quando o usuário marca os 5 períodos. Os 400 XP já ganhos
   são preservados na migração (viram xpRotina), nada de progresso é perdido. */
const XP_BLOCO=25,XP_MATERIA=120,XP_CICLO=500;
/* CURVA DE NÍVEL — quadrática, com topo em 12 níveis (Secretário da Fazenda).
   custo(n) = 500 + 150(n-1) + 70(n-1)²  → cada nível custa bem mais que o anterior.
   nv2=500 · nv5=3.880 · nv8=13.020 · nv10=24.180 · nv12(topo)=40.700 XP acumulados.
   Calibrada pelo ganho real do app: rotina completa 145/dia + 50 questões 75/dia +
   blocos/matérias ~45/dia ≈ 265 XP/dia → topo em ~150 dias (5 meses).
   Com 100 questões/dia (~365 XP/dia) → ~112 dias (menos de 4 meses).
   Ritmo leve (~150/dia) → o topo continua sendo conquista de longo prazo. */
const NIVEL_MAX=12;
const XP_BASE=500,XP_LIN=150,XP_QUAD=70;
const XP_ROT_ATIV=5,XP_ROT_ESTUDO=10,XP_ROT_DIA=40;
/* Constantes das questões ficam aqui em cima porque xpTotal() é chamado na
   inicialização (antes do módulo de questões) — declará-las lá embaixo quebrava
   o app com "Cannot access 'XP_Q' before initialization" para quem já tinha
   histórico de questões salvo. */
const META_Q=50,XP_Q=1,XP_Q_META=25,XP_Q_EXTRA_MAX=50,MIN_VOL=10;
const XP_MED_ROTINA=[40,60,90,120,180,240,300];
const TITULOS=['Estagiário fiscal','Auxiliar fiscal','Fiscal júnior','Fiscal pleno','Analista tributário',
 'Auditor júnior','Auditor pleno','Auditor sênior','Auditor-chefe',
 'Coordenador de fiscalização','Superintendente fiscal','Secretário da Fazenda'];

/* ---------- rotina diária (cronograma) ---------- */
/* i = início em minutos, f = fim em minutos, pt = horário pontual, t = tipo */
const ROTINA=[
 {p:'m',i:300,f:315,pt:1,t:'acordar',n:'Acordar'},
 {p:'m',i:330,f:336,pt:1,t:'treino',n:'Ir para a academia'},
 {p:'m',i:330,f:400,t:'treino',n:'Treino · 1h10'},
 {p:'m',i:400,f:420,t:'casa',n:'Volta para casa · 20 min'},
 {p:'m',i:420,f:510,t:'cafe',n:'Banho, café e preparar-se · 1h30'},
 {p:'m',i:510,f:525,pt:1,t:'trabalho',n:'Sair para o trabalho'},
 {p:'t',i:915,f:930,pt:1,t:'casa',n:'Chegar em casa',s:'Lanche e desligar do trabalho'},
 {p:'t',i:940,f:970,t:'cochilo',n:'Cochilo',s:'⏰ Alarme · terminar às 16:10'},
 {p:'t',i:975,f:1015,t:'estudo',n:'Estudo'},
 {p:'t',i:1025,f:1065,t:'estudo',n:'Estudo'},
 {p:'t',i:1075,f:1115,t:'estudo',n:'Estudo'},
 {p:'t',i:1125,f:1165,t:'estudo',n:'Estudo'},
 {p:'t',i:1175,f:1195,t:'estudo',n:'Estudo'},
 {p:'n',i:1195,f:1260,t:'familia',n:'Jantar, família e organização da casa'},
 {p:'n',i:1260,f:1275,pt:1,t:'telas',n:'Sem telas'},
 {p:'n',i:1275,f:1290,pt:1,t:'dormir',n:'Dormir'}
];
const PERIODOS=[['m','🌅 MANHÃ'],['t','🌇 TARDE · ESTUDOS'],['n','🌙 NOITE']];
const ESTUDOS=ROTINA.filter(r=>r.t==='estudo');
const IDX_ESTUDO=ROTINA.map((r,i)=>r.t==='estudo'?i:-1).filter(i=>i>=0);
const META_MIN=ESTUDOS.reduce((s,r)=>s+(r.f-r.i),0);
const SICO={estudo:'i-livro',treino:'i-halter',cochilo:'i-lua',cafe:'i-cafe',casa:'i-casa',familia:'i-familia',
  acordar:'i-relogio',trabalho:'i-predio',telas:'i-lua',dormir:'i-lua'};

/* ===================== ESTADO + MIGRAÇÃO ===================== */
const K2='fiscoquest.v2',K1='fiscoquest.v1';
const store={
  read(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return (window.__fq&&window.__fq[k])||null}},
  write(k,s){try{localStorage.setItem(k,JSON.stringify(s))}catch(e){window.__fq=window.__fq||{};window.__fq[k]=s}}
};
function novoEstado(){return{v:2,blocos:{},ciclo:new Array(8).fill(false),ciclosConcluidos:0,medalhas:{},streak:0,ultimoDia:null,diasAtivos:0,diasConcluidos:0,diaFeito:null,
  rot:{d:null,st:{}},                    /* marcações do cronograma de hoje */
  rotHist:{},                            /* XP de rotina já fechado, por dia anterior */
  q:{b:{},hist:{}},                      /* questões: desempenho por bloco + histórico diário */
  xpMedalhas:0,medalhasPagas:{},
  rotStreak:0,rotMaxStreak:0,rotDiasTotal:0,rotUltimoDia:null}}
let STORAGE_OK=true;                      /* A2: o app precisa saber se realmente consegue salvar */
try{localStorage.setItem('fq.probe','1');STORAGE_OK=localStorage.getItem('fq.probe')==='1';localStorage.removeItem('fq.probe')}
catch(e){STORAGE_OK=false}
let S=novoEstado();
(function carregar(){
  const v2=store.read(K2);
  if(v2){S=Object.assign(S,v2);return}
  const v1=store.read(K1);
  if(v1){ /* migração: preserva progresso, medalhas serão recalculadas */
    S.blocos=v1.blocos||{};S.ciclo=Array.isArray(v1.ciclo)&&v1.ciclo.length===8?v1.ciclo:S.ciclo;
    S.ciclosConcluidos=v1.ciclosConcluidos||0;S.streak=v1.streak||0;S.ultimoDia=v1.ultimoDia||null;S.diasAtivos=v1.diasAtivos||0;
  }
})();
if(!Array.isArray(S.ciclo)||S.ciclo.length!==8)S.ciclo=new Array(8).fill(false);
if(!S.blocos||typeof S.blocos!=='object')S.blocos={};
if(!S.medalhas||typeof S.medalhas!=='object')S.medalhas={};
if(typeof S.diasConcluidos!=='number')S.diasConcluidos=0;   /* histórico; o XP não depende dele */
if(S.diaFeito===undefined)S.diaFeito=null;
if(!S.rot||typeof S.rot!=='object'||typeof S.rot.st!=='object')S.rot={d:null,st:{}};
if(!S.rotHist||typeof S.rotHist!=='object')S.rotHist={};
if(!S.q||typeof S.q!=='object')S.q={b:{},hist:{}};
if(!S.q.b||typeof S.q.b!=='object')S.q.b={};
if(!S.q.hist||typeof S.q.hist!=='object')S.q.hist={};
if(typeof S.qRecorde!=='number')S.qRecorde=0;
delete S.xpRotina;   /* saldo antigo do cronograma: não é mais usado (XP é derivado das marcações) */
if(typeof S.xpMedalhas!=='number')S.xpMedalhas=0;
if(!S.medalhasPagas||typeof S.medalhasPagas!=='object')S.medalhasPagas={};
if(typeof S.rotDiasTotal!=='number')S.rotDiasTotal=S.diasConcluidos||0;
if(typeof S.rotStreak!=='number')S.rotStreak=(S.diaFeito&&S.diaFeito===new Date().toISOString().slice(0,10))?1:0;
if(typeof S.rotMaxStreak!=='number')S.rotMaxStreak=S.rotStreak;
if(S.rotUltimoDia===undefined)S.rotUltimoDia=S.diaFeito||null;
S.v=2;
const salvar=()=>store.write(K2,S);

/* ---- derivações ---- */
const feito=(m,b)=>!!(S.blocos[m]&&S.blocos[m][b]);
const blocosFeitos=m=>S.blocos[m]?Object.values(S.blocos[m]).filter(Boolean).length:0;
const totalBlocos=m=>MATERIAS[m].blocos.length;
const totalFeitos=()=>MATERIAS.reduce((s,_,i)=>s+blocosFeitos(i),0);
const pctMateria=m=>Math.round(blocosFeitos(m)/totalBlocos(m)*100);
const cicloFeitas=()=>S.ciclo.filter(Boolean).length;
const pctCiclo=()=>Math.round(cicloFeitas()/8*100);
const indiceAtual=()=>{const i=S.ciclo.indexOf(false);return i===-1?7:i};
function xpTotal(){                       /* soma das 4 fontes; nenhuma se sobrepõe */
  return totalFeitos()*XP_BLOCO                                   /* blocos estudados   */
    +cicloFeitas()*XP_MATERIA                                     /* matérias do ciclo  */
    +S.ciclosConcluidos*(8*XP_MATERIA+XP_CICLO)                   /* ciclos fechados    */
    +xpRotinaTotal()+(S.xpMedalhas||0)                              /* cronograma + medalhas */
    +xpQuestoes()}                                                  /* questões (derivado do histórico) */
function custoNivel(n){return XP_BASE+XP_LIN*(n-1)+XP_QUAD*(n-1)*(n-1)}   /* XP para sair do nível n */
function xpAcumulado(n){let s=0;for(let k=1;k<n;k++)s+=custoNivel(k);return s}
function nivel(){const xp=xpTotal();let n=1;
  while(n<NIVEL_MAX&&xp>=xpAcumulado(n+1))n++;
  const base=xpAcumulado(n),meta=custoNivel(n),atual=xp-base;
  if(n>=NIVEL_MAX)return{n:NIVEL_MAX,max:true,titulo:TITULOS[NIVEL_MAX-1],atual:meta,meta,falta:0,pct:100};
  return{n,max:false,titulo:TITULOS[Math.min(n-1,TITULOS.length-1)],atual,meta,falta:meta-atual,pct:Math.round(atual/meta*100)}}
const hoje=()=>new Date().toISOString().slice(0,10);
function marcarDia(){const h=hoje();if(S.ultimoDia===h)return;
  const ont=new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak=(S.ultimoDia===ont)?S.streak+1:1;S.ultimoDia=h;S.diasAtivos++}

/* ===================== MEDALHAS — 48 ===================== */
const RARIDADES=['bronze','prata','ouro','platina','diamante','mestre'];

function metaBlocos(m,nivel){const t=totalBlocos(m);
  return nivel===1?1:nivel===2?Math.ceil(t/4):nivel===3?Math.ceil(t/2):nivel===4?Math.ceil(t*3/4):t}
function condicao(m,nivel){const f=blocosFeitos(m),t=totalBlocos(m);
  if(nivel===1)return f>=1;
  if(nivel===2)return f*4>=t;
  if(nivel===3)return f*2>=t;
  if(nivel===4)return f*4>=t*3;
  if(nivel===5)return f>=t;
  return f>=t&&S.ciclo[m]===true}
function requisito(m,nivel){const t=totalBlocos(m),alvo=metaBlocos(m,nivel),nome=MATERIAS[m].nome;
  if(nivel===1)return `Conclua o primeiro bloco de ${nome}.`;
  if(nivel===5)return `Conclua os ${t} blocos de ${nome}.`;
  if(nivel===6)return `Conclua os ${t} blocos e marque ${nome} como concluída no ciclo atual.`;
  return `Conclua pelo menos ${nivel===2?25:nivel===3?50:75}% dos blocos (${alvo} de ${t}).`}

function recalcularMedalhas(){
  const novas=[];
  MEDALHAS.forEach(md=>{
    const ok=md.valida(),tinha=!!S.medalhas[md.id];
    if(ok&&!tinha){S.medalhas[md.id]=hoje();
      if(md.xp&&!S.medalhasPagas[md.id]){S.medalhasPagas[md.id]=1;S.xpMedalhas+=md.xp}  /* pago uma única vez */
      novas.push(md)}
    else if(!ok&&tinha){delete S.medalhas[md.id]}
  });
  return novas}

/* ===================== QUESTÕES =====================
   Fonte única de verdade: S.q.b[bloco] = {a,e}. Total = a+e, % = a/total.
   O XP das questões é DERIVADO do histórico diário — editar ou zerar recalcula
   sozinho, nunca soma duas vezes e nunca dá para farmar repetindo lançamento. */
const qKey=(m,j)=>m+':'+j;
function qBloco(m,j){const r=S.q.b[qKey(m,j)];return{a:r?r.a:0,e:r?r.e:0}}
const qTot=b=>b.a+b.e;
const qPct=b=>qTot(b)?Math.round(b.a/qTot(b)*100):null;
function qMateriaSoma(m){let a=0,e=0;MATERIAS[m].blocos.forEach((_,j)=>{const b=qBloco(m,j);a+=b.a;e+=b.e});return{a,e}}
function qGeral(){let a=0,e=0;MATERIAS.forEach((_,m)=>{const x=qMateriaSoma(m);a+=x.a;e+=x.e});return{a,e}}
function qDia(d){const x=S.q.hist[d];return{q:x?x.q:0,a:x?x.a:0,e:x?x.e:0}}
const qHoje=()=>qDia(hoje());
function xpDia(d){const q=d.q||0;if(q<=0)return 0;
  let x=q*XP_Q;                                        /* 1 XP por questão */
  if(q>=META_Q)x+=XP_Q_META+Math.min(q-META_Q,XP_Q_EXTRA_MAX);  /* meta + excedente (teto 50) */
  return x}
function xpQuestoes(){let s=0;for(const k in S.q.hist)s+=xpDia(S.q.hist[k]);return s}
const STATUS=[[90,'EXCELENTE','exc'],[80,'MUITO BOM','mb'],[70,'BOM','bom'],[60,'ATENÇÃO','at'],[0,'REVISAR','rev']];
function statusDe(p){if(p===null)return['SEM REGISTRO','zero'];

function blocosCom(min){const o=[];MATERIAS.forEach((mt,m)=>mt.blocos.forEach((nome,j)=>{
  const b=qBloco(m,j),t=qTot(b);if(t>=min)o.push({m,j,nome,t,p:qPct(b)})}));return o}
function diasComDados(n){const ds=Object.keys(S.q.hist).sort();return ds.slice(-n)}
function somaPeriodo(de,ate){let q=0,a=0;for(const k in S.q.hist){if(k>=de&&k<=ate){q+=S.q.hist[k].q;a+=S.q.hist[k].a}}return{q,a}}
function diaISO(off){return new Date(Date.now()-off*864e5).toISOString().slice(0,10)}
function evolucao(){const at=somaPeriodo(diaISO(6),diaISO(0)),ant=somaPeriodo(diaISO(13),diaISO(7));
  if(!at.q||!ant.q)return null;
  const pa=Math.round(at.a/at.q*100),pb=Math.round(ant.a/ant.q*100);return{pa,pb,dif:pa-pb}}
let qMateriaAberta=0,qEdit={key:null,a:0,e:0},qConfirm=null,qOrd='edital';

function qAbrirEditor(k){const [m,j]=k.split(':').map(Number),b=qBloco(m,j);
  qEdit={key:k,a:b.a,e:b.e};qConfirm=null;render()}
function qPasso(campo,d){if(!qEdit.key)return;
  qEdit[campo]=Math.max(0,Math.min(999,(qEdit[campo]||0)+d));

  const el=document.getElementById('qin-'+campo);if(el)el.value=qEdit[campo]}
function qPreviewTxt(){const t=qEdit.a+qEdit.e;
  return t?`${t} questões · ${Math.round(qEdit.a/t*100)}% de aproveitamento`:'nenhuma questão registrada'}
/* A3: cada bloco guarda um razão por dia (l). Ao reduzir/zerar, as questões saem
   do dia em que foram lançadas (do mais recente para o mais antigo), então o XP e o
   histórico daquele dia são estornados corretamente — e não jogados em cima de hoje. */
function histAdd(d,campo,v){
  const x=S.q.hist[d]||{q:0,a:0,e:0};
  x[campo]=Math.max(0,(x[campo]||0)+v);
  x.q=Math.max(0,(x.q||0)+v);
  if(!x.q&&!x.a&&!x.e)delete S.q.hist[d];else S.q.hist[d]=x;
}
function qAplicar(novo){
  const k=qEdit.key;if(!k)return null;
  const rec=S.q.b[k]||{a:0,e:0,l:{}};
  if(!rec.l||typeof rec.l!=='object')rec.l={};      /* lançamento antigo, sem razão */
  const h=hoje();let dQ=0;
  ['a','e'].forEach(c=>{
    let dif=(novo[c]||0)-(rec[c]||0);dQ+=dif;
    if(dif>0){rec.l[h]=rec.l[h]||{a:0,e:0};rec.l[h][c]=(rec.l[h][c]||0)+dif;histAdd(h,c,dif)}
    else if(dif<0){let falta=-dif;
      Object.keys(rec.l).sort().reverse().forEach(d=>{
        if(!falta)return;const v=rec.l[d][c]||0;if(v<=0)return;
        const t=Math.min(v,falta);rec.l[d][c]=v-t;histAdd(d,c,-t);falta-=t});
      if(falta)histAdd(h,c,-falta);                  /* sobra de lançamento sem razão */
    }
  });
  rec.a=novo.a||0;rec.e=novo.e||0;
  Object.keys(rec.l).forEach(d=>{if(!rec.l[d].a&&!rec.l[d].e)delete rec.l[d]});
  if(!rec.a&&!rec.e)delete S.q.b[k];else S.q.b[k]=rec;
  return dQ}
function qSalvar(el){
  if(!qEdit.key)return;
  const antesXP=xpTotal(),antesQ=qHoje().q;
  const dQ=qAplicar({a:qEdit.a,e:qEdit.e});
  qEdit={key:null,a:0,e:0};qConfirm=null;
  if(dQ>0)marcarDia();
  S.qRecorde=Math.max(S.qRecorde||0,qTot(qGeral()));   /* recorde histórico: medalha não se perde ao zerar */
  processarMedalhas();salvar();
  const depois=xpTotal(),agoraQ=qHoje().q;
  xpMostrado=antesXP;render();animarXP(antesXP,depois);
  const ganho=depois-antesXP;
  if(ganho>0)xpPop((ganho>0?'+':'')+ganho+' XP',el);
  toast(dQ===0?'✓ DESEMPENHO ATUALIZADO':'✓ QUESTÕES REGISTRADAS','blue');
  if(antesQ<META_Q&&agoraQ>=META_Q)setTimeout(()=>celebrarMeta(agoraQ),240);
  else if(agoraQ>META_Q&&dQ>0)toast('🔥 +'+(agoraQ-META_Q)+' ACIMA DA META','blue');
  checarNivel();
}
let qUndo=null;                 /* snapshot para desfazer o último "zerar" */
function qZerar(){
  if(!qConfirm)return;
  const k=qConfirm;
  qUndo={k,b:JSON.parse(JSON.stringify(S.q.b[k]||null)),hist:JSON.parse(JSON.stringify(S.q.hist))};

/* ---- utilitários de navegação/overlay (à prova de falha) ---- */
function remover(el){try{if(el&&el.parentNode)el.parentNode.removeChild(el)}catch(e){}}
const ACOES=['nav','tab','abrir','bloco','concluir','desfazer','med','xp','backup','qundo','slot','qmat','qedit','qstep','qsave','qcancel','qzero','qzerook','qord'];
function alvoDe(no){           /* substitui closest(): funciona também quando o toque cai num <svg>/<use> */
  for(let el=no;el;el=el.parentElement||el.parentNode){
    if(!el||el.nodeType!==1)continue;
    const d=el.dataset;
    if(d&&ACOES.some(k=>d[k]!==undefined))return el;
    if(el===document.body)break;
  }
  return null;
}
function limparOverlaysPresos(){ /* nenhum overlay pode ficar travando a tela */
  document.querySelectorAll('.unlock,.levelup,.celebrate').forEach(o=>{   /* modais do usuário não entram: só fecham no toque */
    const t=+(o.dataset.t||0);if(t&&Date.now()-t>15000)remover(o)});
}

/* fila de desbloqueios */
function enfileirar(novas){if(!novas.length)return;fila=fila.concat(novas);if(!mostrando)proxima()}
function proxima(){
  if(!fila.length){mostrando=false;render();return}
  mostrando=true;
  const md=fila.shift(),restantes=fila.length;
  const cab=md.nivel===6?'👑 MESTRE DA MATÉRIA':md.nivel===5?'MATÉRIA CONCLUÍDA!':'🏅 MEDALHA DESBLOQUEADA';
  const ov=document.createElement('div');ov.className='unlock';ov.dataset.t=Date.now();
  const partes=Array.from({length:md.nivel>=5?10:md.nivel>=3?7:5},(_,i)=>{
    const a=i/(md.nivel>=5?10:md.nivel>=3?7:5)*2*Math.PI;
    return `<span class="part" style="--dx:${(Math.cos(a)*82).toFixed(0)}px;--dy:${(Math.sin(a)*82).toFixed(0)}px;animation-delay:${(i*45)}ms;background:${i%2?md.cor:'#8DE9F7'}"></span>`}).join('');
  ov.innerHTML=`<div class="ubox"><div class="halo"></div>${partes}
    <div class="umed">${medalSVG(md,true,132)}</div>
    <div class="uhead">${cab}</div><div class="uname">${esc(md.titulo)}</div>
    <div class="umat">${esc(grupoNome(md))} · ${RAR_LABEL[md.rar]}${md.xp?' · +'+md.xp+' XP':''}</div>
    ${restantes?`<div class="utoast">+${restantes} para mostrar</div>`:''}</div>`;
  phone.appendChild(ov);
  /* 6 s na tela; qualquer toque na tela dispensa na hora (o overlay cobre tudo,
     então o toque não chega a nenhum botão abaixo). Timer único por medalha. */
  let saindo=false;
  const fechar=()=>{
    if(saindo||!ov.parentNode)return;saindo=true;
    clearTimeout(tmr);ov.classList.add('saindo');
    setTimeout(()=>{remover(ov);
      if(!fila.length&&contadorTotal>1)toast('🎉 '+contadorTotal+' medalhas!','blue');
      proxima()},240)};
  ov.onclick=fechar;
  const tmr=setTimeout(fechar,6000);
}

function slotHTML(k,now){
  const r=ROTINA[k],ok=slotFeito(k);
  const st=ok?'past':((now>=r.i&&now<r.f)?'live':(now>=r.f?'late':'fut'));
  const premio=premioDe(k);
  const ico=SICO[r.t]||'i-relogio';
  const min=r.f-r.i;
  const titulo=(r.t==='estudo'||r.t==='cochilo')?`${r.n} · ${min} min`:r.n;
  let sub;
  if(ok)sub='✓ concluído'+(r.s?' · '+r.s:'');
  else if(st==='live')sub=(r.pt?'toque para concluir':`faltam ${Math.max(1,r.f-now)} min · toque ao terminar`)+` · +${premio} XP`;
  else if(st==='late')sub=`pendente · toque para concluir · +${premio} XP`;
  else sub=(r.s?r.s+' · ':'')+`+${premio} XP`;
  const marca=ok?'<span class="sok"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'
    :'<span class="sbox"></span>';
  const dir=(st==='live'?'<span class="snow">AGORA</span>':'')+marca;
  return `<button class="slot ${st}" data-slot="${k}" aria-pressed="${ok}">
    <div class="shr">${hhmm(r.i)}${r.pt?'':`<span>${hhmm(r.f)}</span>`}</div>
    <span class="sico ${r.t||''}"><svg width="18" height="18"><use href="#${ico}"/></svg></span>
    <div class="sbody"><h4>${esc(titulo)}</h4>${sub?`<p>${esc(sub)}</p>`:''}</div>
    ${dir}</button>`;
}

        <span class="rar">${ok?RAR_LABEL[md.rar]:'BLOQUEADA'}</span></button>`}).join('')}</div></div>`}).join('')}`;
}

/* ---- extrato do XP: toda fonte aparece aqui, e a soma tem de bater ---- */
function qTotalRegistrado(){let q=0;for(const k in S.q.hist)q+=S.q.hist[k].q;return q}
function xpFontes(){
  const b=totalFeitos(),cic=8*XP_MATERIA+XP_CICLO;
  return [
   {n:'Blocos estudados',dt:`${b} × ${XP_BLOCO} XP`,v:b*XP_BLOCO},
   {n:'Matérias do ciclo',dt:`${cicloFeitas()} × ${XP_MATERIA} XP`,v:cicloFeitas()*XP_MATERIA},
   {n:'Ciclos completos',dt:`${S.ciclosConcluidos} × ${cic} XP`,v:S.ciclosConcluidos*cic},
   {n:'Cronograma · hoje',dt:`${IDX_ESTUDO.filter(k=>slotFeito(k)).length} estudos e ${ROTINA.filter((r,k)=>slotFeito(k)&&r.t!=='estudo').length} atividades marcadas agora`,v:xpRotinaHoje()},
   {n:'Cronograma · dias anteriores',dt:`${Object.keys(S.rotHist||{}).length} dias fechados`,v:xpRotinaTotal()-xpRotinaHoje()},
   {n:'Questões',dt:`${qTotalRegistrado()} questões registradas`,v:xpQuestoes()},
   {n:'Medalhas',dt:`${Object.keys(S.medalhasPagas||{}).length} com recompensa`,v:S.xpMedalhas||0}
  ];
}
function abrirXP(){
  const f=xpFontes(),soma=f.reduce((s,x)=>s+x.v,0),nv=nivel();
  const ov=document.createElement('div');ov.className='modal';ov.dataset.t=Date.now();
  ov.innerHTML=`<div class="mbox" style="max-width:320px;text-align:left">
    <h3 style="text-align:center">Extrato de XP</h3>
    <div class="mmat" style="text-align:center">nível ${nv.n} · ${esc(nv.titulo)}</div>
    ${f.map(x=>`<div style="display:flex;align-items:baseline;gap:8px;margin-top:11px">
      <div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:800;color:#fff">${x.n}</div>
        <div style="font-size:10.5px;font-weight:600;color:#9EB8DD">${esc(x.dt)}</div></div>
      <div style="font-size:14px;font-weight:800;color:${x.v?'#F2C14E':'#5D739B'}">${x.v.toLocaleString('pt-BR')}</div></div>`).join('')}
    <div class="mstatus on" style="display:flex;justify-content:space-between">
      <span>TOTAL</span><span>${soma.toLocaleString('pt-BR')} XP</span></div>
    <div class="val" style="text-align:center;font-size:11px;color:#9EB8DD;margin-top:8px">
      ${nv.max?'nível máximo alcançado':`faltam ${nv.falta.toLocaleString('pt-BR')} XP para o nível ${nv.n+1}`}</div>
    <button class="mclose">Fechar</button></div>`;
  phone.appendChild(ov);
  ov.addEventListener('click',e=>{if(e.target===ov||(e.target.classList&&e.target.classList.contains('mclose')))remover(ov)});
}

/* A1: backup do progresso. Tudo mora no localStorage; sem exportação, limpar os dados
   do navegador ou trocar de aparelho apaga meses de estudo. */
function backupJSON(){return JSON.stringify(S)}
function abrirBackup(modo){
  const ov=document.createElement('div');ov.className='modal';
  if(modo==='exp'){
    const json=backupJSON();
    ov.innerHTML=`<div class="mbox" style="max-width:330px">
      <h3>Exportar progresso</h3>
      <div class="mmat">baixe o arquivo ou copie o texto e guarde em local seguro</div>
      <textarea class="ta" id="expTxt" readonly aria-label="Backup do progresso">${esc(json)}</textarea>
      <div class="qacoes"><button class="btn3d" id="baixar" style="min-height:46px;font-size:13px">BAIXAR ARQUIVO</button>
        <button class="btn-sm gray" id="copiar">COPIAR</button></div>
      <button class="mclose">Fechar</button></div>`;
  }else{
    ov.innerHTML=`<div class="mbox" style="max-width:330px">
      <h3>Importar progresso</h3>
      <div class="mmat">cole o backup exportado anteriormente</div>
      <textarea class="ta" id="impTxt" placeholder="{ ... }" aria-label="Cole aqui o backup"></textarea>
      <div class="aviso" style="color:#7A5306">Isso substitui todo o progresso atual deste aparelho.</div>
      <button class="btn3d" id="importar" style="margin-top:10px;min-height:46px;font-size:13px">SUBSTITUIR PROGRESSO</button>
      <button class="mclose">Cancelar</button></div>`;
  }
  phone.appendChild(ov);
  ov.addEventListener('click',e=>{if(e.target===ov||(e.target.classList&&e.target.classList.contains('mclose')))remover(ov)});
  const bx=ov.querySelector('#baixar');
  if(bx)bx.onclick=()=>{
    try{const b=new Blob([backupJSON()],{type:'application/json'});
      const url=URL.createObjectURL(b),a=document.createElement('a');
      a.href=url;a.download='fisco-quest-'+hoje()+'.json';document.body.appendChild(a);a.click();
      setTimeout(()=>{URL.revokeObjectURL(url);remover(a)},800);
      toast('✓ ARQUIVO GERADO','blue');
    }catch(e){toast('copie o texto acima','gray')}};
  const cp=ov.querySelector('#copiar');
  if(cp)cp.onclick=()=>{const t=ov.querySelector('#expTxt');
    try{t.select();t.setSelectionRange(0,999999);
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value);
      else document.execCommand('copy');
      toast('✓ COPIADO','blue')}catch(e){toast('selecione e copie','gray')}};
  const im=ov.querySelector('#importar');
  if(im)im.onclick=()=>{
    const t=ov.querySelector('#impTxt');let d=null;
    try{d=JSON.parse((t.value||'').trim())}catch(e){}
    if(!d||typeof d!=='object'||(!d.blocos&&!d.q&&!d.medalhas)){toast('backup inválido','gray');return}
    try{store.write(K2,d)}catch(e){}
    remover(ov);toast('✓ PROGRESSO IMPORTADO','blue');
    setTimeout(()=>{try{location.reload()}catch(e){S=Object.assign(novoEstado(),d);xpMostrado=xpTotal();render()}},500);
  };
}

/* modal de detalhe */
function abrirModal(id){
  const md=MEDALHAS.find(x=>x.id===id);if(!md)return;
  const ok=medalhaAtiva(md.id),m=md.materia,rot=md.materia<0;   /* rotina e questões não têm matéria */
  const f=rot?0:blocosFeitos(m),t=rot?0:totalBlocos(m);
  const prog=rot?md.progresso():`${f}/${t} blocos${md.nivel===6?` · matéria ${S.ciclo[m]?'concluída':'não concluída'} no ciclo`:''}`;
  const dataOk=S.medalhas[md.id];
  const ov=document.createElement('div');ov.className='modal';ov.dataset.t=Date.now();
  ov.innerHTML=`<div class="mbox">
    ${medalSVG(md,ok,140)}
    <h3>${esc(md.titulo)}</h3>
    <div class="mmat">${esc(grupoNome(md))} · nível ${md.nivel}</div>
    <span class="mrar" style="background:${ok?RAR_COR[md.rar]:'rgba(255,255,255,.12)'};color:${ok?'#08203F':'#A9BEDC'}">${RAR_LABEL[md.rar]}</span>
    <div class="lbl">DESCRIÇÃO</div><div class="val">${esc(md.descricao)}</div>
    <div class="lbl">REQUISITO</div><div class="val">${esc(md.requisito)}</div>
    <div class="lbl">PROGRESSO</div><div class="val">${esc(prog)}</div>
    ${md.xp?`<div class="lbl">RECOMPENSA</div><div class="val">+${md.xp} XP ao desbloquear</div>`:''}
    ${ok&&dataOk?`<div class="lbl">CONQUISTADA EM</div><div class="val">${dataOk.split('-').reverse().join('/')}</div>`:''}
    <div class="mstatus ${ok?'on':'off'}">${ok?'✓ DESBLOQUEADA':'🔒 BLOQUEADA'}</div>
    <button class="mclose">Fechar</button></div>`;
  phone.appendChild(ov);
  const fechar=e=>{if(e.target===ov||(e.target.classList&&e.target.classList.contains('mclose')))remover(ov)};
  ov.addEventListener('click',fechar);
}

/* ===================== AÇÕES ===================== */
function animarXP(de,ate){const el=$('#xpNum');xpMostrado=ate;if(!el)return;
  const t0=performance.now();
  (function passo(t){const k=Math.min(1,(t-t0)/700);
    el.textContent=Math.round(de+(ate-de)*(1-Math.pow(1-k,3))).toLocaleString('pt-BR');
    if(k<1)requestAnimationFrame(passo)})(t0)}

function toggleBloco(m,j){
  const antes=xpTotal();
  if(!S.blocos[m])S.blocos[m]={};
  const novo=!feito(m,j);
  if(novo)S.blocos[m][j]=true;else delete S.blocos[m][j];
  if(novo)marcarDia();
  const novas=processarMedalhas();salvar();
  const depois=xpTotal();
  toast((depois>antes?'+':'−')+Math.abs(depois-antes)+' XP',depois>antes?'':'gray');
  xpMostrado=antes;render();animarXP(antes,depois);
  if(novo)comemorar();
  checarNivel();
}
function concluirMateria(i){
  if(S.ciclo[i])return;
  S.ciclo[i]=true;marcarDia();
  const antes=xpMostrado;
  if(cicloFeitas()===8){
    processarMedalhas();salvar();xpMostrado=xpTotal();render();
    toast('+'+XP_MATERIA+' XP');comemorar();setTimeout(fecharCiclo,900);return}
  processarMedalhas();salvar();render();
  toast('+'+XP_MATERIA+' XP');comemorar();animarXP(antes,xpTotal());
  checarNivel();
}
function fecharCiclo(){
  S.ciclosConcluidos++;S.ciclo=new Array(8).fill(false);
  processarMedalhas();salvar();
  const box=document.createElement('div');box.className='celebrate';box.dataset.t=Date.now();
  box.innerHTML=`<div class="box"><svg class="cheer" aria-hidden="true" width="92" height="92" viewBox="0 0 120 120"><use href="#mascot-art"/></svg>
    <h3>Ciclo ${S.ciclosConcluidos} concluído</h3>
    <p>8 de 8 matérias fechadas · +${XP_CICLO} XP de bônus.<br>O ciclo ${S.ciclosConcluidos+1} começa em Língua portuguesa.</p>
    <button class="btn3d" id="fechaCelebra">COMEÇAR NOVO CICLO</button></div>`;
  phone.appendChild(box);
  box.querySelector('#fechaCelebra').onclick=()=>{remover(box);xpMostrado=xpTotal();render();checarNivel()};
  xpMostrado=xpTotal();render();
}
function desfazerMateria(i){
  if(!S.ciclo[i])return;
  const antes=xpMostrado;S.ciclo[i]=false;
  processarMedalhas();salvar();render();
  toast('−'+XP_MATERIA+' XP','gray');animarXP(antes,xpTotal());
  nivelVisto=nivel().n;
}

document.addEventListener('click',e=>{
  const alvo=alvoDe(e.target);
  if(!alvo)return;
  const d=alvo.dataset;
  /* navegação: nunca é bloqueada por trava de tempo */
  if(d.med!==undefined){abrirModal(d.med);return}
  if(d.xp!==undefined){abrirXP();return}
  if(d.backup!==undefined){abrirBackup(d.backup);return}
  if(d.tab!==undefined){irPara(d.tab);return}
  if(d.nav!==undefined){irPara(d.nav);return}
  if(d.abrir!==undefined){const m=+d.abrir;
    if(isNaN(m)||!MATERIAS[m])return;
    materiaAberta=m;irPara('v-materia');return}
  if(d.qmat!==undefined){const m=+d.qmat;if(isNaN(m)||!MATERIAS[m])return;
    qMateriaAberta=m;qEdit={key:null,a:0,e:0};qConfirm=null;irPara('v-qmateria');return}
  if(d.qord!==undefined){qOrd=d.qord;render();return}
  if(d.qedit!==undefined){qAbrirEditor(d.qedit);return}
  if(d.qstep!==undefined){const[c,v]=d.qstep.split(':');qPasso(c,+v);return}
  if(d.qcancel!==undefined){qEdit={key:null,a:0,e:0};qConfirm=null;render();return}
  if(d.qzero!==undefined){qConfirm=d.qzero;qEdit={key:null,a:0,e:0};render();return}
  /* ações que alteram progresso: trava curta só contra toque duplo no mesmo item */
  const agora=Date.now(),chave=(d.bloco||'')+'|'+(d.concluir||'')+'|'+(d.desfazer||'')+'|'+(d.slot||'');
  if(chave===ultimaChave&&agora-ultimaAcao<400)return;
  ultimaChave=chave;ultimaAcao=agora;
  if(d.slot!==undefined){toggleSlot(+d.slot,alvo);return}
  if(d.qsave!==undefined){qSalvar(alvo);return}
  if(d.qzerook!==undefined){qZerar();return}
  if(d.qundo!==undefined){qDesfazer();return}
  if(d.bloco!==undefined){const[m,j]=d.bloco.split(':').map(Number);toggleBloco(m,j);return}
  if(d.concluir!==undefined){concluirMateria(+d.concluir);return}
  if(d.desfazer!==undefined){alvo.classList.add('is-undo');desfazerMateria(+d.desfazer);return}
});
document.addEventListener('input',e=>{
  const t=e.target;if(!t||!t.dataset||t.dataset.qin===undefined||!qEdit.key)return;
  const v=Math.max(0,Math.min(999,parseInt(t.value||'0',10)||0));
  if(t.value!==''&&String(v)!==t.value)t.value=v;      /* M5: o campo reflete o limite real */
  qEdit[t.dataset.qin]=v;
  const p=document.getElementById('qprev');if(p)p.textContent=qPreviewTxt();
});
function relogio(){const d=new Date();$('#clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}
let ultMin=-1;
function tique(){                    /* M2: só redesenha quando o minuto (ou o dia) realmente vira */
  relogio();limparOverlaysPresos();
  const virou=limparRotinaDoDia();if(virou)salvar();
  const m=agoraMin();
  if(virou&&(tela==='v-home'||tela==='v-crono')){ultMin=m;render();return}
  if(tela==='v-crono'&&m!==ultMin)render();
  ultMin=m;
}
relogio();setInterval(tique,20000);
limparRotinaDoDia();
recalcularMedalhas();salvar();   /* recálculo silencioso ao abrir, sem animação */
atualizarMascote();
render();
</script>
